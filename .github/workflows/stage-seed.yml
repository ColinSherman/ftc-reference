name: Refresh staging data
# Replaces the staging D1 with a fresh copy of production, then applies main's migrations.
# Production is only exported (read). Staging has no cron of its own, so this is how it stays current.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1" # Mondays 08:17 UTC

concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a92ff6c4b72094e5030585f2363b940a
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm stage:resources
      - run: pnpm stage:seed
